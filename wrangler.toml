name = "arsenalreportredux"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = false

# Workers Static Assets (not legacy Workers Sites): asset reads aren't KV
# operations, so scanner traffic doesn't burn the KV quota. Every request runs
# through worker.js so it can add security headers and inject Umami.
# html_handling = "none": paths map to files exactly, as under Workers Sites, so
# /admin.html (the path Cloudflare Access gates) is served as-is instead of
# being redirected to an ungated /admin.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = true

[vars]
UMAMI_SITE_ID = "de17b826-bf03-441d-92a2-434e6ad21ca5"

# Daily squad sync (06:00 UTC) — diffs the squad against football-data.org
# and writes findings to pending_updates for admin review.
# Requires secrets: ADMIN_JWT (already set), FOOTBALL_DATA_TOKEN
# (free key from https://www.football-data.org/client/register).
[triggers]
crons = ["0 6 * * *"]
